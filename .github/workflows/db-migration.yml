name: Database Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Migration action to execute'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - 'upgrade'
          - 'current'
          - 'history'
      seed:
        description: 'Seed catalog data after migration (Hiljhil Roasters catalog)'
        required: false
        default: false
        type: boolean

jobs:
  migrate:
    name: Run Alembic Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify Database Secret
        env:
          SQL_DB: ${{ secrets.SQL_DB }}
        run: |
          if [ -z "$SQL_DB" ]; then
            echo "::error::SQL_DB secret is not configured in GitHub repository secrets. Please add SQL_DB under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "SQL_DB secret is present."

      - name: Apply Migrations
        env:
          SQL_DB: ${{ secrets.SQL_DB }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.action }}" in
              "current")
                alembic current
                ;;
              "history")
                alembic history --verbose
                ;;
              *)
                alembic upgrade head
                ;;
            esac
          else
            alembic upgrade head
          fi

      - name: Seed Database (Optional Manual Trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed == true }}
        env:
          SQL_DB: ${{ secrets.SQL_DB }}
        run: |
          python -m src.db.seed
